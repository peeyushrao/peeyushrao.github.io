name: Auto-update Sidebar

on:
  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - '!_sidebar.md'
      - '!README.md'

jobs:
  update-sidebar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate _sidebar.md
        run: |
          python3 << 'PYEOF'
          import os

          SECTIONS = [
            ("Interview-QA", "Interview Q&A"),
            ("CrowdStrike",  "CrowdStrike"),
            ("IR",           "IR"),
            ("Zscaler",      "Zscaler"),
            ("Windows",      "Windows"),
            ("Linux",        "Linux"),
          ]

          def get_title(filepath):
            try:
              with open(filepath, encoding="utf-8") as f:
                for line in f:
                  line = line.strip()
                  if line.startswith("# "):
                    return line[2:].strip()
            except Exception:
              pass
            name = os.path.splitext(os.path.basename(filepath))[0]
            return name.replace("_", " ").replace("-", " ").title()

          def collect(folder):
            if not os.path.isdir(folder):
              return {}, []
            subgroups = {}
            root_files = []
            for entry in sorted(os.scandir(folder), key=lambda e: e.name.lower()):
              if entry.is_dir():
                files = []
                for sub in sorted(os.scandir(entry.path), key=lambda e: e.name.lower()):
                  if sub.is_file() and sub.name.endswith(".md") and not sub.name.startswith("_"):
                    files.append((get_title(sub.path), f"{folder}/{entry.name}/{sub.name}"))
                if files:
                  subgroups[entry.name] = files
              elif entry.is_file() and entry.name.endswith(".md") and not entry.name.startswith("_"):
                root_files.append((get_title(entry.path), f"{folder}/{entry.name}"))
            return subgroups, root_files

          lines = []
          for folder, label in SECTIONS:
            subgroups, root_files = collect(folder)
            if not subgroups and not root_files:
              continue
            lines.append(f"- **{label}**")
            for title, path in root_files:
              lines.append(f"  - [{title}]({path})")
            for sub, files in subgroups.items():
              lines.append(f"  - **{sub}**")
              for title, path in files:
                lines.append(f"    - [{title}]({path})")

          with open("_sidebar.md", "w", encoding="utf-8") as f:
            f.write("\n".join(lines) + "\n")

          print("Done. _sidebar.md written.")
          PYEOF

      - name: Commit updated sidebar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _sidebar.md
          if git diff --cached --quiet; then
            echo "No changes to sidebar."
          else
            git commit -m "chore: auto-update _sidebar.md"
            git push
          fi
