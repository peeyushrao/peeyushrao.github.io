<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Peeyush Rao – Security Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">

  <!-- Docsify base theme (vue) — we override almost everything below -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
    /* ── Tokens ───────────────────────────────────────────── */
    :root {
      --bg:           #F7F5F0;
      --sidebar-bg:   #1A1814;
      --sidebar-w:    300px;
      --surface:      #FFFFFF;
      --border:       rgba(0,0,0,0.08);
      --text:         #1A1814;
      --text-muted:   #6B6860;
      --text-faint:   #A8A49C;
      --accent:       #4A8C60;
      --accent-light: #EAF2EC;
      --accent-dim:   #2D5A3D;
      --heading-font: 'Instrument Serif', serif;
      --body-font:    'DM Sans', sans-serif;
      --mono-font:    'DM Mono', monospace;
    }

    /* ── Base ─────────────────────────────────────────────── */
    * { box-sizing: border-box; }

    body {
      font-family: var(--body-font);
      background: var(--bg);
      color: var(--text);
      margin: 0;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w) !important;
      background: var(--sidebar-bg) !important;
      border-right: none !important;
      padding: 0 !important;
    }

    /* Site name */
    .sidebar > h1,
    .app-name {
      padding: 2rem 1.5rem 1.5rem !important;
      margin: 0 !important;
      border-bottom: 1px solid rgba(255,255,255,0.06) !important;
    }

    .app-name-link {
      font-family: var(--heading-font) !important;
      font-size: 1.15rem !important;
      font-weight: 400 !important;
      color: #EDE9E0 !important;
      line-height: 1.35 !important;
      text-decoration: none !important;
    }

    .app-name-link em {
      font-style: italic;
      color: #7DC495;
    }

    /* Search box */
    .search {
      padding: 1rem 1.25rem !important;
      border-bottom: 1px solid rgba(255,255,255,0.06) !important;
      margin: 0 !important;
    }

    .search input {
      background: rgba(255,255,255,0.06) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
      border-radius: 8px !important;
      color: #EDE9E0 !important;
      font-family: var(--body-font) !important;
      font-size: 13px !important;
      padding: 8px 12px !important;
      width: 100% !important;
    }

    .search input::placeholder { color: rgba(255,255,255,0.3) !important; }
    .search input:focus { outline: none !important; border-color: rgba(122,196,149,0.4) !important; }

    /* Nav */
    .sidebar-nav {
      padding: 1rem 0 2rem !important;
      overflow-y: auto;
    }

    /* Section headers (bold items) */
    .sidebar-nav > ul > li > p,
    .sidebar-nav > ul > li > a:not([href]) {
      font-size: 11px !important;
      font-weight: 500 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      color: rgba(255,255,255,0.35) !important;
      padding: 1rem 1.5rem 0.4rem !important;
      margin: 0 !important;
      cursor: pointer;
    }

    /* Bold section labels from **text** */
    .sidebar-nav li > p > strong,
    .sidebar-nav li > strong {
      font-size: 11px !important;
      font-weight: 500 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      color: rgba(255,255,255,0.35) !important;
    }

    /* All nav links */
    .sidebar-nav li a {
      font-family: var(--body-font) !important;
      font-size: 13.5px !important;
      font-weight: 300 !important;
      color: rgba(237,233,224,0.7) !important;
      padding: 6px 1.5rem !important;
      white-space: normal !important;
      line-height: 1.5 !important;
      border-radius: 0 !important;
      display: block;
      text-decoration: none !important;
      transition: color 0.15s, background 0.15s !important;
      border-left: 2px solid transparent;
    }

    .sidebar-nav li a:hover {
      color: #EDE9E0 !important;
      background: rgba(255,255,255,0.04) !important;
    }

    .sidebar-nav li a.active {
      color: #7DC495 !important;
      background: rgba(122,196,149,0.08) !important;
      border-left-color: #7DC495 !important;
      font-weight: 400 !important;
    }

    /* Nested items indent */
    .sidebar-nav ul ul li a {
      padding-left: 2.25rem !important;
      font-size: 13px !important;
    }

    .sidebar-nav ul ul ul li a {
      padding-left: 3rem !important;
      font-size: 12.5px !important;
    }

    /* Collapse arrows */
    .sidebar-nav .collapse-title::after,
    .sidebar-nav li.open > p::after {
      color: rgba(255,255,255,0.25) !important;
    }

    /* ── Main content area ────────────────────────────────── */
    .content {
      left: var(--sidebar-w) !important;
      background: var(--bg) !important;
      padding: 0 !important;
    }

    .markdown-section {
      max-width: 760px !important;
      margin: 0 auto !important;
      padding: 3rem 2.5rem 5rem !important;
    }

    /* ── Typography ───────────────────────────────────────── */
    .markdown-section h1 {
      font-family: var(--heading-font) !important;
      font-size: 2.6rem !important;
      font-weight: 400 !important;
      line-height: 1.15 !important;
      letter-spacing: -0.3px !important;
      color: var(--text) !important;
      margin: 0 0 0.5rem !important;
      border-bottom: none !important;
      padding-bottom: 0 !important;
    }

    .markdown-section h1 em { font-style: italic; color: var(--accent); }

    .markdown-section h2 {
      font-family: var(--heading-font) !important;
      font-size: 1.7rem !important;
      font-weight: 400 !important;
      color: var(--text) !important;
      margin: 2.5rem 0 1rem !important;
      border-bottom: 1px solid var(--border) !important;
      padding-bottom: 0.5rem !important;
    }

    .markdown-section h3 {
      font-family: var(--body-font) !important;
      font-size: 1rem !important;
      font-weight: 500 !important;
      color: var(--text) !important;
      margin: 2rem 0 0.75rem !important;
      letter-spacing: 0.01em !important;
    }

    .markdown-section p {
      font-size: 15px !important;
      line-height: 1.8 !important;
      color: var(--text-muted) !important;
      font-weight: 300 !important;
      margin: 0 0 1rem !important;
    }

    .markdown-section strong { font-weight: 500 !important; color: var(--text) !important; }

    .markdown-section a {
      color: var(--accent) !important;
      text-decoration: underline !important;
      text-underline-offset: 3px !important;
      text-decoration-thickness: 1px !important;
    }

    .markdown-section a:hover { opacity: 0.75 !important; }

    /* Lists */
    .markdown-section ul, .markdown-section ol {
      padding-left: 1.5rem !important;
      margin: 0.75rem 0 1rem !important;
    }

    .markdown-section li {
      font-size: 15px !important;
      line-height: 1.8 !important;
      color: var(--text-muted) !important;
      font-weight: 300 !important;
      margin-bottom: 4px !important;
    }

    .markdown-section li strong { color: var(--text) !important; }

    /* Code inline */
    .markdown-section code {
      font-family: var(--mono-font) !important;
      font-size: 13px !important;
      background: rgba(45,90,61,0.08) !important;
      color: var(--accent-dim) !important;
      padding: 2px 7px !important;
      border-radius: 5px !important;
      border: none !important;
    }

    /* Code blocks */
    .markdown-section pre {
      background: var(--sidebar-bg) !important;
      border-radius: 10px !important;
      padding: 1.25rem 1.5rem !important;
      margin: 1.25rem 0 !important;
      overflow-x: auto !important;
      border: none !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08) !important;
    }

    .markdown-section pre code {
      background: transparent !important;
      color: #C8E6C9 !important;
      font-size: 13px !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }

    /* Blockquote */
    .markdown-section blockquote {
      border-left: 3px solid var(--accent) !important;
      background: var(--accent-light) !important;
      margin: 1.25rem 0 !important;
      padding: 0.75rem 1.25rem !important;
      border-radius: 0 8px 8px 0 !important;
    }

    .markdown-section blockquote p {
      color: var(--accent-dim) !important;
      margin: 0 !important;
    }

    /* Tables */
    .markdown-section table {
      width: 100% !important;
      border-collapse: collapse !important;
      font-size: 14px !important;
      margin: 1.25rem 0 !important;
      border-radius: 10px !important;
      overflow: hidden !important;
    }

    .markdown-section th {
      background: var(--sidebar-bg) !important;
      color: rgba(237,233,224,0.8) !important;
      font-weight: 500 !important;
      font-size: 12px !important;
      letter-spacing: 0.05em !important;
      text-transform: uppercase !important;
      padding: 10px 14px !important;
      text-align: left !important;
    }

    .markdown-section td {
      padding: 10px 14px !important;
      border-bottom: 1px solid var(--border) !important;
      color: var(--text-muted) !important;
      font-weight: 300 !important;
      vertical-align: top !important;
    }

    .markdown-section tr:last-child td { border-bottom: none !important; }
    .markdown-section tr:nth-child(even) td { background: rgba(0,0,0,0.02) !important; }

    /* Horizontal rule */
    .markdown-section hr {
      border: none !important;
      border-top: 1px solid var(--border) !important;
      margin: 2rem 0 !important;
    }

    /* ── Top navbar ───────────────────────────────────────── */
    nav.app-nav {
      display: none !important;
    }

    /* ── Cover page (if used) ─────────────────────────────── */
    section.cover {
      background: var(--sidebar-bg) !important;
    }

    /* ── Scrollbar ────────────────────────────────────────── */
    .sidebar-nav::-webkit-scrollbar { width: 4px; }
    .sidebar-nav::-webkit-scrollbar-track { background: transparent; }
    .sidebar-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* ── Mobile ───────────────────────────────────────────── */
    @media (max-width: 768px) {
      .sidebar { width: 100% !important; }
      .content { left: 0 !important; }
      .markdown-section { padding: 2rem 1.25rem 4rem !important; }
      .markdown-section h1 { font-size: 2rem !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Peeyush Rao – <em>Security Notes</em>',
      loadSidebar: true,
      sidebarDisplayLevel: 0,
      auto2top: true,
      search: {
        placeholder: 'Search notes…',
        noData: 'Nothing found.',
        depth: 3
      }
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Search plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>

  <!-- Sidebar collapse plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- Code highlight -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
</body>
</html>
