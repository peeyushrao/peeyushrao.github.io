<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Peeyush Rao – Interview Notes</title>

  <!-- Docsify theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Sidebar width + readability polish -->
  <style>
    /* Increase sidebar width */
    .sidebar {
      width: 360px;
    }

    /* Push main content to the right */
    .content {
      left: 360px;
    }

    /* Allow multi-line titles in sidebar */
    .sidebar-nav li a {
      white-space: normal;
      line-height: 1.4;
      padding-top: 6px;
      padding-bottom: 6px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Peeyush Rao – Security Interview Notes',

      // Sidebar
      loadSidebar: true,

      // Fully collapsed by default
      sidebarDisplayLevel: 0,

      // UX improvements
      auto2top: true
    }
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- Sidebar collapse plugin -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
